name: "Xfinity Internet and Mobile Usage"
description: "Get Xfinity Internet and Mobile Usage Data"
url: "https://github.com/thor0215/hassio-xfinity-usage"
version: "2026.11.1"
image: "ghcr.io/thor0215/hassio-xfinity-usage"
slug: "xfinity-usage"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
map:
  - type: app_config
    read_only: false
backup_exclude:
  - "profile*"
services:
  - mqtt:want

options:
  internet_usage_enabled: true
  mobile_usage_enabled: true
  page_timeout: 60
  polling_rate: 3600
  clear_token: false
  log_level: info
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: addons
  mqtt_raw_usage: false

schema:
  refresh_token: str?
  xfinity_code: str?
  internet_usage_enabled: bool?
  mobile_usage_enabled: bool?
  clear_token: bool
  page_timeout: int(15,)?
  polling_rate: int(30,)?
  log_level: list(info|debug)?
  mqtt_enabled: bool?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_raw_usage: bool
