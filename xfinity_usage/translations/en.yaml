---
configuration:
  xfinity_username:
    name: Xfinity Username
  xfinity_password:
    name: Xfinity Password
  refresh_token:
    name: Xfinity App Refresh Token
    description: >-
      Addon will automatically add this option. 
  xfinity_code:
    name: Xfinity Code
    description: >-
      Example code value: oi-f0a780e44b644ee199b3f2f2b16ae09a
  internet_usage_enabled:
    name: Enable Internet Usage
    description: >-
      Check and publish usage for your Xfinity Internet subscription.
  mobile_usage_enabled:
    name: Enable Mobile Usage
    description: >-
      Check and publish usage for your Xfinity Mobile subscription.
  mobile_diagnostics_enabled:
    name: Create Usage Diagnostics Export
    description: >-
      Save a sanitized local report of Internet and Mobile response shapes with
      rounded usage amounts. Nothing is sent automatically.
  page_timeout:
    name: HTTP Timeout (Seconds)
    description: >-
      How many seconds to wait for the web server to send data before giving up.
  polling_rate:
    name: Polling Rate (Seconds)
    description: >-
      This setting will change how often the addon will poll for new usage data
  clear_token:
    name: Clear Xfinity App Refresh Token
    description: >-
      Use this if the token is failing and you need to get a new token. 
  log_level:
    name: Log level
    description: >-
      Sets the verbosity of log output.
  mqtt_enabled:
    name: Enable MQTT 
    description: >-
      Instructs the Addon to push usage data to the configured MQTT Broker.
  mqtt_host:
    name: MQTT Hostname
    description: >-
      MQTT Broker hostname
  mqtt_port:
    name: MQTT Port
    description: >-
      MQTT Broker port number
  mqtt_username:
    name: MQTT Username
    description: >-
      MQTT Broker Username (optional)
  mqtt_password:
    name: MQTT Password
    description: >-
      MQTT Broker Password (optional)
  mqtt_raw_usage:
    name: MQTT Raw Usage
    description: >-
      Add raw usage json to MQTT sensor. (optional)
    