name: Preview Old Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  preview:
    name: Preview package retention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preview package retention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/package_retention.py
